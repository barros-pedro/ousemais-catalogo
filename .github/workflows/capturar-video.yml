name: Capturar telas para o vídeo
on:
  push:
    branches: [video-capturas]
jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node _video/capture.js https://ousemaisoficial.com.br cap
      - uses: actions/upload-artifact@v4
        with:
          name: cap
          path: cap
