name: Capturar telas para o vídeo
on:
  push:
    branches: [video-capturas]
permissions:
  contents: write
jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node _video/capture.js https://ousemaisoficial.com.br cap
      - run: |
          git config user.name "Captura"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cap && git commit -qm "Capturas" && git push
